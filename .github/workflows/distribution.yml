# quaked-prod-release-v1
name: Distribution
on:
  pull_request:
  push:
    branches: [Dev, Prod]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/Prod' }}
jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.identity.outputs.publish }}
      commit: ${{ steps.identity.outputs.commit }}
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: identity
        run: node tools/distribution/release.mjs context
        env:
          GH_TOKEN: ${{ github.token }}
  web:
    needs: source
    # Keep the existing real Chrome HTTP/file/tamper trials on macOS.
    runs-on: macos-15
    timeout-minutes: 60
    env:
      RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
      RELEASE_VERSION: ${{ needs.source.outputs.version }}
    outputs:
      html-sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      # The texture custody contract tests drive /usr/bin/python3 with Pillow and
      # NumPy, pinned to the verified authoring environment (texture-tier-standard).
      - run: /usr/bin/python3 -m pip install --user --disable-pip-version-check pillow==10.1.0 numpy==1.26.2
      - run: npm run test:distribution
      - run: npm run build:web
      - run: node tools/distribution/verify-site.mjs dist/web
      - run: node tools/distribution/browser-trial.mjs
        timeout-minutes: 30
        env:
          QUAKED_CHROME_CHANNEL: chrome
      - run: node tools/distribution/browser-trial.mjs "" dist/browser-trial-file.json
        timeout-minutes: 30
        env:
          QUAKED_CHROME_CHANNEL: chrome
          QUAKED_TRIAL_MODE: file
      - run: node tools/distribution/browser-trial.mjs "" dist/browser-trial-tamper.json
        timeout-minutes: 10
        env:
          QUAKED_CHROME_CHANNEL: chrome
          QUAKED_TRIAL_TAMPER: '1'
      - id: digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/Prod'
        run: |
          node tools/distribution/release.mjs stamp-web dist/web
          tested=$(node -p "require('./dist/browser-trial.json').targetSha256")
          actual=$(shasum -a 256 dist/web/index.html | cut -d' ' -f1)
          test "$tested" = "$actual"
          echo "sha256=$actual" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/Prod'
        with:
          name: tested-web
          path: |
            dist/web/index.html
            dist/web/data/
            dist/web/web-release.json
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-evidence
          path: |
            dist/web/inventory.json
            dist/browser-trial*
  mac:
    needs: source
    strategy:
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    env:
      RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
      RELEASE_VERSION: ${{ needs.source.outputs.version }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/.distribution-cache/target
      # Only the Prod Apple Silicon leg uploads immutable data parts. Dev/PR
      # qualification and the Intel leg keep testing the fully bundled path.
      QUAKED_PACK_BASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/Prod' && matrix.runner == 'macos-15' && format('https://github.com/{0}/releases/download/data/', github.repository) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci --ignore-scripts
      # The texture custody contract tests drive /usr/bin/python3 with Pillow and
      # NumPy, pinned to the verified authoring environment (texture-tier-standard).
      - run: /usr/bin/python3 -m pip install --user --disable-pip-version-check pillow==10.1.0 numpy==1.26.2
      - run: npm run test:distribution
      - run: npm run build:desktop
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo build --locked --manifest-path src-tauri/Cargo.toml --example lan_test_bridge
      - run: node tools/distribution/engine-tests.mjs
        env:
          QUAKED_LAN_TEST_BRIDGE: ${{ github.workspace }}/.distribution-cache/target/debug/examples/lan_test_bridge
      - name: Upload immutable game-pack parts
        if: github.event_name == 'push' && github.ref == 'refs/heads/Prod' && matrix.runner == 'macos-15'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/distribution/upload-packs.mjs
      - run: npm run tauri -- build --target universal-apple-darwin -- --locked
      - run: node tools/distribution/archive-mac.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.runner }}
          path: dist/release/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: mac-evidence-${{ matrix.runner }}
          path: dist/desktop/inventory.json
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/Prod'
    needs: [source, web, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
      RELEASE_VERSION: ${{ needs.source.outputs.version }}
    outputs:
      identity-sha256: ${{ steps.publish.outputs.identity_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: tested-web
          path: tested-web
      - uses: actions/download-artifact@v4
        with:
          name: mac-macos-15
          path: tested-mac
      - id: publish
        name: Publish or verify this exact release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/distribution/release.mjs publish tested-web tested-mac
      - uses: actions/upload-artifact@v4
        with:
          name: release-identity
          path: dist/release-identity/release.json
          retention-days: 7
  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/Prod'
    needs: [source, web, mac, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
      RELEASE_VERSION: ${{ needs.source.outputs.version }}
      RELEASE_IDENTITY_SHA256: ${{ needs.release.outputs.identity-sha256 }}
      RELEASE_HTML_SHA256: ${{ needs.web.outputs.html-sha256 }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tested-web
          path: dist/pages
      - uses: actions/download-artifact@v4
        with:
          name: release-identity
          path: dist/pages
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
          path: source
          persist-credentials: false
          sparse-checkout: |
            tools/distribution/verify-site.mjs
            tools/distribution/release.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node source/tools/distribution/verify-site.mjs dist/pages
      - run: node source/tools/distribution/release.mjs verify-web dist/pages
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages
      - uses: actions/deploy-pages@v4
        id: deployment
