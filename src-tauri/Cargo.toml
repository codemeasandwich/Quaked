[package]
name = "quaked"
version = "0.132.5"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Per-game data packs: native download (no browser cross-origin limits) and verification.
ureq = { version = "2.12", default-features = false, features = ["tls"] }
sha2 = "0.10"
url = "2.5"

[target.'cfg(target_os = "macos")'.dependencies]
# Pointer lock (mouse look) in WKWebView: src/pointer_lock.rs. The versions Tauri already uses.
objc2 = "0.6"
block2 = "0.6"
# Switch Pro Controller motion over IOKit HID: src/gyro_hid.rs. The CoreFoundation binding Tauri already builds.
core-foundation-sys = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
