<h1>Classic output colour parity</h1><pre id="result">Running…</pre>
<script type="module">
import '../src/newer/install.js'; // Newer Game plugs into the engine's hooks (src/engine/common/hooks.js)
await import('../src/engine/render/gl_rsurf.js');
const THREE=await import('three'),split=await import('../src/newer/render/r_demosplit.js');
const renderer=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});renderer.setSize(128,128);renderer.toneMapping=THREE.LinearToneMapping;renderer.toneMappingExposure=1.5;renderer.setClearColor(0,1);document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-1,1,1,-1,.1,10);camera.position.z=2;
const materials=[];let i=0;for(const colour of [new THREE.Color(.004,.008,.016),new THREE.Color(.03,.08,.2),new THREE.Color(.85,.6,.4),new THREE.Color(1.1,.9,.2)]){
 const material=new THREE.MeshBasicMaterial({color:colour});materials.push(material);const mesh=new THREE.Mesh(new THREE.PlaneGeometry(1,1),material);mesh.position.set(i%2===0?-.5:.5,i<2?.5:-.5,0);scene.add(mesh);i++;
}
const gl=renderer.getContext(),native=new Uint8Array(128*128*4),classic=new Uint8Array(native.length);
const runs=[];split.r_demosplit.value=2;
for(const exposure of [.5,1,1.5,2]){
renderer.toneMappingExposure=exposure;
renderer.render(scene,camera);gl.readPixels(0,0,128,128,gl.RGBA,gl.UNSIGNED_BYTE,native);
split.R_DemoSplitClassic(renderer,scene,camera,{lx:0,ly:0,lw:128,lh:128},()=>{},()=>{},{width:128,height:128});gl.readPixels(0,0,128,128,gl.RGBA,gl.UNSIGNED_BYTE,classic);
let maximumError=0,pixelsOverTwo=0;for(let p=0;p<native.length;p+=4){let error=0;for(let c=0;c<3;c++)error=Math.max(error,Math.abs(native[p+c]-classic[p+c]));maximumError=Math.max(maximumError,error);if(error>2)pixelsOverTwo++;}
runs.push({exposure,maximumError,pixelsOverTwo});}
const error=gl.getError(),result={passed:runs.every(r=>r.maximumError<=2)&&error===0,runs,glError:error,pixels:128*128};document.querySelector('#result').textContent=JSON.stringify(result,null,2);document.title=(result.passed?'PASS':'FAIL')+' classic colour parity';
