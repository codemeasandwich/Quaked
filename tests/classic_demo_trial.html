<!DOCTYPE html>
<html>
<head>
	<base href="../">
	<meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<title>Quaked classic isolation trial</title>
	<link rel="icon" type="image/svg+xml" href="icon.svg">
	<link rel="apple-touch-icon" href="icon.png">
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		html, body {
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #000;
		}
		canvas {
			display: block;
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			width: 100%;
			height: 100%;
		}
		#loading {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
			z-index: 100;
			background: #000;
		}
		#loading-bar {
			width: 200px;
			height: 2px;
			background: #333;
		}
		#loading-progress {
			width: 0%;
			height: 100%;
			background: #fff;
		}
	</style>
</head>
<body>
	<div id="loading">
		<div id="loading-bar"><div id="loading-progress"></div></div>
	</div>
	<script type="importmap">
	{
		"imports": {
			"three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js",
			"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/"
		}
	}
	</script>
<section style="position:fixed;top:8px;left:8px;z-index:200;color:white;background:#101318dd;padding:10px;font:13px system-ui;max-width:520px">
<strong id="classic-status">Waiting for title demo…</strong>
<div><button id="all">All enhancements</button><button id="lighting">Lighting off</button><button id="normals">Normals off</button><button id="liquids">Liquids off</button><button id="full">Full classic</button><button id="split">Split demo</button><button id="flashblend">Native baked lights</button><button id="shadows">Native shadows</button></div>
<pre id="classic-evidence" style="white-space:pre-wrap;margin:6px 0 0"></pre></section>
<script type="module" src="tests/classic_demo_trial.js"></script>
</body>
</html>
