	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		html, body {
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #000;
		}
		canvas {
			display: block;
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			width: 100%;
			height: 100%;
		}
		#loading {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
			z-index: 100;
			background: #000;
		}
		/* The logo fills from the bottom up as the game data downloads (src/newer/ui/loading_screen.js). */
		#loading-logo {
			display: block;
			width: min(80vw, 560px);
			height: auto;
		}
		#loading-logo .logo-base {
			fill: #333;
		}
		#loading-logo .logo-fill {
			fill: #fff;
		}
		:root {
			--studio-safe-right: env(safe-area-inset-right, 0px);
			--studio-safe-bottom: env(safe-area-inset-bottom, 0px);
		}
		#loading-studio-logo {
			position: absolute;
			right: max(16px, env(safe-area-inset-right, 0px));
			bottom: max(16px, env(safe-area-inset-bottom, 0px));
			width: min(128px, 20vw, 20vh);
			height: auto;
			pointer-events: none;
		}
	</style>
</head>
