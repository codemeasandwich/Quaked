<script type="module">

 const index=await (await fetch('newer/enemies/index.json',{cache:'no-store'})).json();skins.R_NewerSetIndex(index);
 for(const v of [post.r_hdr,post.r_dynres,post.r_bloom,post.r_volumetric,post.r_bounce,post.r_newbright,post.r_newcontrast,post.r_newdark,post.r_newedges,anim.r_newer_lighting,anim.r_newer_normals,anim.r_newer_enemies])if(!cvars.Cvar_FindVar(v.name))cvars.Cvar_RegisterVariable(v);
 for(const [name,value] of Object.entries({r_hdr:1,r_dynres:0,r_newer_lighting:1,r_newer_normals:1,r_newer_enemies:1,r_bloom:0,r_volumetric:0,r_bounce:0,r_newbright:1,r_newcontrast:1,r_newdark:1,r_newedges:0}))cvars.Cvar_SetValue(name,value);
 const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('#view'),antialias:false,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setSize(1200,720,false);renderer.setClearColor(0x1c2029,1);
 const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(40,1200/720,4,1500);camera.up.set(0,0,1);

 for(const key of Object.keys(index.nativeHeights)){
  const model=models.Mod_ForName('progs/'+key+'.mdl',true),header=models.Mod_Extradata(model),entity={model,frame:0,skinnum:0,origin:[0,0,0],angles:[0,0,0],_entityIndex:1};entities.set(key,{entity,header});

 }

 const lights=[{origin:[140,-90,120],radius:450,die:1e9,minlight:0},{origin:[-80,100,90],radius:180,die:1e9,minlight:0}];

  evidence.headSwitchChecks=results;evidence.checks=checks;document.querySelector('#evidence').textContent=JSON.stringify(evidence,null,2);

 async function compareAuthoring(){

  const material=skins.R_NewerAliasMaterial(model.entity,model.entity.model.name,true);
  authoringUniforms=uniforms(material);authoredNormal=authoringUniforms.qrNormal.value;
  const image=new Image();image.src='docs/evidence/height-authoring-baseline/shambler-custom.webp';await image.decode();
  const c=document.createElement('canvas');c.width=image.width;c.height=image.height;const ctx=c.getContext('2d');ctx.drawImage(image,0,0);const rgba=ctx.getImageData(0,0,c.width,c.height).data;

 async function verifyCatalog(){

   const height=Float32Array.from({length:image.width*image.height},(_,i)=>raw[i*4]/255),expected=kernel.R_NormalsFromCraftedHeight(height,image.width,image.height,spec.strength,spec.cap);

   while(performance.now()<deadline){const got=u.qrNormal.value?.image.data;matches=got?.length===expected.length && got.every((v,i)=>v===expected[i]);if(matches)break;await new Promise(r=>setTimeout(r,20));}

 draw();
