<!DOCTYPE html>
<html>
<head>
<base href="../">
	<meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<title>Lighting performance trial</title>
	<link rel="icon" type="image/svg+xml" href="icon.svg">
	<link rel="apple-touch-icon" href="icon.png">
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		html, body {
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #000;
		}
		canvas {
			display: block;
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			width: 100%;
			height: 100%;
		}
		#loading {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
			z-index: 100;
			background: #000;
		}
		#loading-bar {
			width: 200px;
			height: 2px;
			background: #333;
		}
		#loading-progress {
			width: 0%;
			height: 100%;
			background: #fff;
		}
	</style>
</head>
<body>
	<div id="loading">
		<div id="loading-bar"><div id="loading-progress"></div></div>
	</div>
	<script type="importmap">
	{
		"imports": {
			"three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js",
			"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/"
		}
	}
	</script>
	<section style="position:fixed;top:8px;left:8px;z-index:200;background:#111d;color:white;padding:8px;font:12px monospace;max-width:460px;max-height:85vh;overflow:auto">
<button id="gpu">Measure GPU passes</button><button id="frames">Measure frame rate</button><button id="dynamic">Measure dynamic only</button>
<div id="status">Loading game…</div><pre id="summary" style="white-space:pre-wrap"></pre><details><summary>Raw measurements</summary><pre id="evidence" style="white-space:pre-wrap"></pre></details></section>
<script type="module" src="tests/lighting_perf_trial.js"></script>
</body>
</html>
