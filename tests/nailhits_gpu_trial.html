<script type="module">

import {r_hdr} from '/src/newer/render/gl_post.js';

 scene.fog=null;spawn(m.MOTE_BUBBLE);const wall=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshBasicMaterial({color:0}));wall.position.z=10;scene.add(wall);const hidden=draw();window.results.push({check:'opaque geometry occludes bubble rim',pass:hidden.every((v,i)=>i%4===3||v===0)});
