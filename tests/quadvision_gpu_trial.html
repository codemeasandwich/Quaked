<h1>Quad vision finite GPU test</h1><p>Actual public module and mask/post shaders with controlled native endpoints. Finite renders and readback; no gameplay or animation loop.</p><pre id="result">Running…</pre>
<script type="module">
import * as THREE from 'three';
import {VISION_COORDINATES_GLSL} from '../src/vision_coordinates.js';
const result=document.querySelector('#result'),owned=[],errors=[];let renderer,api,moduleURL;
const check=(value,message)=>{if(!value)throw Error(message);};
try{
 const width=128,height=96,near=4,far=4096,camera=new THREE.PerspectiveCamera(75,width/height,near,far);camera.updateMatrixWorld();
 renderer=new THREE.WebGLRenderer();renderer.setSize(width,height);document.body.append(renderer.domElement);renderer.debug.onShaderError=(gl,program,vertex,fragment)=>errors.push(gl.getProgramInfoLog(program)+'\n'+gl.getShaderInfoLog(fragment));
 const geometry=new THREE.PlaneGeometry(80,100),header={posedata:[[]],frames:[{firstpose:0,numposes:1}],template:{posAttr:geometry.getAttribute('position'),indices:Array.from(geometry.index.array)}};owned.push(geometry);
 const enemy={free:false,v:{health:100,deadflag:0,flags:32,modelindex:1,frame:0,origin:[0,0,-200],angles:[0,0,0]}},server={edicts:[enemy],models:[null,{cache:{data:header}}],time:1,worldmodel:{}},client={stats:[100],items:1,intermission:0,time:1};let local=true;
 globalThis.__quadVisionTest={THREE,VISION_COORDINATES_GLSL,sv:server,cl:client,FL_MONSTER:32,IT_QUAD:1,STAT_HEALTH:0,SV_FaceLocalActive:()=>local,GL_DrawAliasFrame:actual=>actual.template};
 // Keep the production function/shader bodies exact. Replace only imported

 const source=await(await fetch('../src/r_quadvision.js')).text(),body=source.replace(/^import[^;]+;\s*/gm,'');moduleURL=URL.createObjectURL(new Blob(['const {THREE,VISION_COORDINATES_GLSL,sv,cl,FL_MONSTER,IT_QUAD,STAT_HEALTH,SV_FaceLocalActive,GL_DrawAliasFrame}=globalThis.__quadVisionTest;\n'+body],{type:'text/javascript'}));api=await import(moduleURL);
 const make=(data,format=THREE.RGBAFormat,type=THREE.FloatType)=>{const t=new THREE.DataTexture(data,width,height,format,type);t.needsUpdate=true;t.minFilter=t.magFilter=THREE.NearestFilter;owned.push(t);return t;};
 const base=new Float32Array(width*height*4),normal=new Float32Array(width*height*4),depth=new Float32Array(width*height);for(let i=0;i<width*height;i++){base.set([.1,.1,.1,1],i*4);normal.set([.5,.5,1,100],i*4);}
 const sceneTexture=make(base),normalTexture=make(normal),depthTexture=make(depth,THREE.RedFormat),hdr={width,height,textures:[sceneTexture,normalTexture],depthTexture},world=new THREE.Scene();world.updateMatrixWorld();let activeTarget=null;const originalSet=renderer.setRenderTarget.bind(renderer),targets=[];renderer.setRenderTarget=target=>{activeTarget=target;if(target?.isWebGLRenderTarget&&!targets.includes(target))targets.push(target);originalSet(target);};
 const rawDepth=distance=>(far-near*far/distance)/(far-near);
 function draw({distance=200,occluder=100,held=false,time=1,optics=null,splitDepth=false,splitHeld=false}={}){
  enemy.v.origin[2]=-distance;server.time=client.time=time;
  // Equal projected size isolates distance blur/fade from perspective shrink.
  const scale=distance/200;header.template={posAttr:geometry.getAttribute('position').clone(),indices:Array.from(geometry.index.array)};for(let i=0;i<header.template.posAttr.count;i++){header.template.posAttr.setX(i,geometry.getAttribute('position').getX(i)*scale);header.template.posAttr.setY(i,geometry.getAttribute('position').getY(i)*scale);}
  for(let i=0;i<width*height;i++){depth[i]=rawDepth(splitDepth&&i%width>=width/2?300:occluder);normal[i*4+3]=held||splitHeld&&i%width<width/2?-52:100;}depthTexture.needsUpdate=true;normalTexture.needsUpdate=true;
  const output=api.R_QuadVisionRender(renderer,sceneTexture,hdr,camera,world,optics);check(output!==sceneTexture,'active public path returned composed texture');const target=targets.find(t=>t.texture===output);const raw=new Uint16Array(width*height*4);renderer.readRenderTargetPixels(target,0,0,width,height,raw);const pixels=Float32Array.from(raw,THREE.DataUtils.fromHalfFloat),columns=new Float64Array(width);let energy=0,purple=0,changed=0;for(let i=0;i<width*height;i++){const r=pixels[i*4],g=pixels[i*4+1],b=pixels[i*4+2];check([r,g,b].every(Number.isFinite),'finite rendered pixels');const weight=Math.max(0,b-.1);columns[i%width]+=weight;energy+=weight;if(weight>.003){changed++;if(b>r&&r>g)purple++;}}
  const peak=Math.max(...columns),edge=Math.max(...columns.slice(1).map((v,i)=>Math.abs(v-columns[i])))/Math.max(peak,.000001);
  const centroid=columns.reduce((sum,value,x)=>sum+value*(x+.5),0)/Math.max(energy,.000001);return{output,pixels,energy,changed,purple,edge,peak,centroid};
 }
 const nearImage=draw(),mask=targets.find(t=>t.depthBuffer);check(mask,'actual mask render target exists');const sample=new Uint16Array(4);renderer.readRenderTargetPixels(mask,width/2,height/2,1,1,sample);const packet=Array.from(sample,THREE.DataUtils.fromHalfFloat);check(Math.abs(packet[0]-1)<.001&&Math.abs(packet[1]-200)<1&&packet[2]>=200,'mask shader stores coverage, true view depth and distance');check(nearImage.changed>100,'hidden enemy creates visible pixels through foreground depth');check(nearImage.purple/nearImage.changed>.95,'revealed silhouette is purple');
 const farImage=draw({distance:1800}),animated=draw({time:1.7}),visible=draw({occluder:300}),held=draw({held:true});check(farImage.energy<nearImage.energy*.65,'distance produces substantial fade');check(farImage.edge<nearImage.edge,'distance softens normalized horizontal silhouette edge');check(animated.pixels.some((v,i)=>Math.abs(v-nearImage.pixels[i])>.005),'simulation time animates purple flame shape');check(visible.changed===0,'ordinary visible enemy receives no through-wall overlay');check(held.changed===0,'held weapon semantic packet protects original picture');
 const shiftedData=new Float32Array(width*height*4);for(let y=0;y<height;y++)for(let x=0;x<width;x++)shiftedData.set([Math.min(1-.5/width,(x+.5)/width+.1875),(y+.5)/height,0,1],(y*width+x)*4);const packedCoordinates=new Uint8Array(width*height*4);for(let i=0;i<width*height;i++){const u=Math.round(shiftedData[i*4]*65535),v=Math.round(shiftedData[i*4+1]*65535);packedCoordinates.set([u>>8,u&255,v>>8,v&255],i*4);}const shiftedCoordinates=make(packedCoordinates,THREE.RGBAFormat,THREE.UnsignedByteType);shiftedCoordinates.userData.visionEncoded=true;const shifted=draw({optics:shiftedCoordinates});check(Math.abs((shifted.centroid-nearImage.centroid)+24)<2,'Quad reveal follows 24-pixel primary optical shift');
 const splitDepth=draw({optics:shiftedCoordinates,splitDepth:true}),splitHeld=draw({optics:shiftedCoordinates,splitHeld:true});let wrongDepth=0,wrongHeld=0;for(let y=0;y<height;y++)for(let x=0;x<width;x++){const i=(y*width+x)*4;if(x>=40&&splitDepth.pixels[i+2]>.103)wrongDepth++;if(x<40&&splitHeld.pixels[i+2]>.103)wrongHeld++;}check(splitDepth.changed>20&&wrongDepth===0,'Quad compares remapped scene depth at the displayed receiver');check(splitHeld.changed>20&&wrongHeld===0,'Quad protects remapped held receiver while revealing adjacent enemy');
 client.items=0;check(api.R_QuadVisionRender(renderer,sceneTexture,hdr,camera,world)===sceneTexture,'native expiry returns original picture');check(errors.length===0,'actual mask and post shaders compile');const gl=renderer.getContext();check(gl.getError()===gl.NO_ERROR,'finite trial has no GPU error');
 result.textContent=JSON.stringify({passed:true,packet,near:{energy:nearImage.energy,changed:nearImage.changed,purple:nearImage.purple,edge:nearImage.edge},far:{energy:farImage.energy,changed:farImage.changed,edge:farImage.edge},visibleChanged:visible.changed,heldChanged:held.changed,optical:{identityCentroid:nearImage.centroid,shiftedCentroid:shifted.centroid,expectedShift:-24,wrongDepth,wrongHeld},errors},null,2);
}catch(error){result.textContent=JSON.stringify({passed:false,error:error.stack,errors},null,2);}finally{api?.R_QuadVisionReset();renderer?.setRenderTarget(null);owned.forEach(resource=>resource.dispose());renderer?.dispose();if(moduleURL)URL.revokeObjectURL(moduleURL);delete globalThis.__quadVisionTest;}
</script>
