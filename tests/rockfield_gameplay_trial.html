<!DOCTYPE html>
<html>
<head>
<base href="../">
	<meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<title>Quaked — continuous rock relief trial</title>
	<link rel="icon" type="image/svg+xml" href="icon.svg">
	<link rel="apple-touch-icon" href="icon.png">
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		html, body {
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #000;
		}
		canvas {
			display: block;
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			width: 100%;
			height: 100%;
		}
		#loading {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
			z-index: 100;
			background: #000;
		}
		#loading-bar {
			width: 200px;
			height: 2px;
			background: #333;
		}
		#loading-progress {
			width: 0%;
			height: 100%;
			background: #fff;
		}
	</style>
</head>
<body>
	<div id="loading">
		<div id="loading-bar"><div id="loading-progress"></div></div>
	</div>
	<script type="importmap">
	{
		"imports": {
			"three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js",
			"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/"
		}
	}
	</script>
	<section style="position:fixed;left:8px;top:8px;z-index:200;color:white;background:#111e;padding:10px;font:13px system-ui;max-width:650px">
<strong>Continuous natural rock relief</strong>
<button id="band-warp">Break up bands: on</button><button id="wall-band">Inspect rock bands</button><button id="toggle">Relief: on</button><button id="position">Outdoor entrance</button><button id="cliff">Cliff close-up</button><button id="retreat">Step back from cliff</button><button id="roof">Look at roof</button><button id="logo" hidden>Inspect carving</button><button id="face" hidden>Inspect demon face</button><button id="face-angle" hidden>Oblique face</button><button id="face-side" hidden>Side of face</button><button id="face-relief" hidden>Face relief: on</button><button id="restart">Restart level</button><button id="measure">Measure on/off frame time</button><button id="hide">Hide controls</button>
<div id="status">Loading…</div><details><summary>Diagnostics and measurement</summary><button id="materials">Inspect visible materials</button><button id="shadow-probe">Inspect GPU shadow masks</button><pre id="materials-report" style="white-space:pre-wrap"></pre><pre id="diagnostics" style="white-space:pre-wrap"></pre><pre id="report" style="white-space:pre-wrap"></pre></details>
</section><script type="module" src="tests/rockfield_gameplay_trial.js"></script>
</body>
</html>
