<!doctype html><meta charset="utf-8"><title>Rockfield bounded GPU check</title><style>body{background:#151515;color:white;font:14px system-ui}#views{display:flex;gap:16px}img{width:384px}pre{white-space:pre-wrap}</style><h2>Controlled height-field shadow check</h2><p>Two fixed draws through Quaked's real material and HDR buffer. Diagnostic heights, unchanged plane and checker texture. No game instance or animation loop.</p><div id="views"></div><pre id="report">Running…</pre>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js"}}</script><script type="module">
try {
 await import('../src/gl_rsurf.js');
 const THREE=await import('three'),post=await import('../src/gl_post.js'),vars=await import('../src/cvar.js'),anim=await import('../src/r_anim.js'),rock=await import('../src/r_rockfield.js');
 for(const v of [post.r_hdr,post.r_dynres,post.r_bloom,post.r_volumetric,post.r_bounce,anim.r_newer_lighting,anim.r_newer_normals,anim.r_newer_water]) if(!vars.Cvar_FindVar(v.name))vars.Cvar_RegisterVariable(v);
 for(const [k,v] of Object.entries({r_hdr:1,r_dynres:0,r_bloom:0,r_volumetric:0,r_bounce:0,r_newer_lighting:1,r_newer_normals:1,r_newer_water:0}))vars.Cvar_SetValue(k,v);
 const points=[[0,0,0],[256,0,0],[256,256,0],[0,256,0]],face={flags:0,plane:{normal:[0,0,1],dist:0},texinfo:{texture:{name:'uwall1_2'}},polys:{numverts:4,verts:points.map(p=>[...p,p[0]/64,p[1]/64,0,0])}};
 const sky={...face,flags:4,plane:{normal:[0,0,-1],dist:-512},texinfo:{texture:{name:'sky1'}},polys:{numverts:4,verts:points.map(p=>[p[0],p[1],512,0,0,0,0])}};
 rock.R_RockfieldBuild({name:'controlled-gpu',surfaces:[face,sky]});
 const geometry=new THREE.PlaneGeometry(256,256);geometry.translate(128,128,0);geometry.setAttribute('uv1',geometry.attributes.uv.clone());rock.R_RockfieldGeometry(geometry,face);
 for(let i=0;i<geometry.attributes.rockInfo.count;i++)geometry.attributes.rockInfo.setY(i,.8);
 const originalPositions=geometry.attributes.position.array.slice(),originalUvs=geometry.attributes.uv.array.slice();
 // This diagnostic sinusoid makes shadowing unambiguous at a grazing light.
 class DiagnosticWorker{postMessage(m){queueMicrotask(()=>{const n=m.config.cells,b=m.config.border,w=n+1+2*b,data=new Float32Array(w*w);for(let y=0;y<w;y++)for(let x=0;x<w;x++){const u=(m.x*n+x-b)/n,v=(m.y*n+y-b)/n;data[y*w+x]=.5+.44*Math.sin(u*2*Math.PI*3+.3*Math.sin(v*6));}this.onmessage({data:{id:m.id,result:{tileX:m.x,tileY:m.y,width:w,data}}});});}terminate(){}}
 const cache=new rock.RockTileCache(()=>new DiagnosticWorker()),chart={id:1,seed:73421,profile:'wall'};
 for(let y=-1;y<=1;y++)for(let x=-1;x<=1;x++){cache.request(chart,x,y);await Promise.resolve();}
 rock.rockUniforms.qrRockHeights.value=cache.heightTexture;rock.rockUniforms.qrRockPages.value=cache.pageTexture;rock.rockUniforms.qrRockProbes=cache.probes;rock.rockUniforms.qrRockSun.value.set(1,0,.08).normalize();
 const pixels=new Uint8Array(32*32*4);for(let y=0;y<32;y++)for(let x=0;x<32;x++){const i=(y*32+x)*4,c=((x>>3)+(y>>3))%2;pixels.set(c?[125,90,55,255]:[70,80,90,255],i);}
 const originalPixels=pixels.slice();
 const texture=new THREE.DataTexture(pixels,32,32);texture.wrapS=texture.wrapT=THREE.RepeatWrapping;texture.colorSpace=THREE.SRGBColorSpace;texture.needsUpdate=true;
 const lm=new THREE.DataTexture(new Uint8Array([128,128,128,255]),1,1);lm.channel=1;lm.needsUpdate=true;
 const material=new THREE.MeshLambertMaterial({map:texture,lightMap:lm,lightMapIntensity:2});material.userData.rockField=true;post.R_RegisterDetail(material,texture);
 const renderer=new THREE.WebGLRenderer({preserveDrawingBuffer:true});renderer.setSize(384,256);renderer.setClearColor(0,0);
 const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(50,1.5,1,1000);camera.position.set(128,128,360);camera.lookAt(128,128,0);camera.updateMatrixWorld();scene.add(new THREE.Mesh(geometry,material));
 const result=[];
 for(const enabled of [0,1]){
  post.R_PostBegin(renderer,true,384,256);rock.rockUniforms.qrRockOn.value=enabled;post.R_PostBind(renderer);renderer.render(scene,camera);
  const target=renderer.getRenderTarget(),rgba=new Uint8Array(target.width*target.height*4);renderer.readRenderTargetPixels(target,0,0,target.width,target.height,rgba,undefined,2);
  let interiorAvailable=0,interiorShadow=0,minAlpha=255;
  for(let y=24;y<target.height-24;y++)for(let x=70;x<target.width-70;x++){const a=rgba[(y*target.width+x)*4+3];if(a>127){interiorAvailable++;minAlpha=Math.min(minAlpha,a);if(a<254)interiorShadow++;}}
  post.R_PostFinish(renderer,scene,camera,{lx:0,ly:0,lw:384,lh:256},0,[],[],0,1,false);
  const img=document.createElement('img');img.src=renderer.domElement.toDataURL();document.querySelector('#views').append(img);
  result.push({enabled:!!enabled,interiorAvailable,interiorShadow,minAlpha,glError:renderer.getContext().getError()});
 }
 const unchanged=originalPositions.every((v,i)=>v===geometry.attributes.position.array[i])&&originalUvs.every((v,i)=>v===geometry.attributes.uv.array[i])&&texture.image.data===pixels&&originalPixels.every((v,i)=>v===pixels[i]);
 const pass=unchanged&&result[1].interiorShadow>result[0].interiorShadow+500&&result.every(r=>r.glError===0);
 document.querySelector('#report').textContent=JSON.stringify({status:pass?'PASS':'FAIL',unchangedGeometryUvsAndAlbedo:unchanged,resident:cache.tiles.size,results:result},null,2);
 cache.dispose();geometry.dispose();material.dispose();texture.dispose();lm.dispose();renderer.dispose();
}catch(error){document.querySelector('#report').textContent='FAIL '+error.stack;}
</script>
