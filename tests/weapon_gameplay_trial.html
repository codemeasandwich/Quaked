<!DOCTYPE html>
<html>
<head>
<base href="../">
	<meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<title>Quaked</title>
	<link rel="icon" type="image/svg+xml" href="icon.svg">
	<link rel="apple-touch-icon" href="icon.png">
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		html, body {
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #000;
		}
		canvas {
			display: block;
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			width: 100%;
			height: 100%;
		}
		#loading {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
			z-index: 100;
			background: #000;
		}
		#loading-bar {
			width: 200px;
			height: 2px;
			background: #333;
		}
		#loading-progress {
			width: 0%;
			height: 100%;
			background: #fff;
		}
	</style>
</head>
<body>
	<div id="loading">
		<div id="loading-bar"><div id="loading-progress"></div></div>
	</div>
	<script type="importmap">
	{
		"imports": {
			"three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js",
			"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/"
		}
	}
	</script>
	<section style="position:fixed;left:8px;top:8px;z-index:200;color:white;background:#111d;padding:8px;font:12px monospace">
<button id="start">Start Newer E1M1</button><select id="weapon"><option value="1">Axe</option><option value="2">Shotgun (original)</option><option value="3" selected>Super shotgun</option><option value="4">Nailgun (original)</option><option value="5">Super nailgun</option><option value="6">Grenade launcher</option><option value="7">Rocket launcher</option><option value="8">Thunderbolt</option></select><button id="fire">Fire once</button><button id="fire-turn">Fire for 1 second</button><button id="art">Toggle weapon art</button><button id="hide-controls">Hide controls (Esc restores)</button><button id="look">Look at shells</button><button id="save">Save shell trial</button><button id="load">Load shell trial</button><a href="tests/weapon_models_trial.html" style="color:white">Model fitting gallery</a><div id="status">Loading…</div></section>
<script type="module" src="tests/weapon_gameplay_trial.js"></script>
</body>
</html>
