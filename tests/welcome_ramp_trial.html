<!DOCTYPE html>
<html>
<head>
<base href="../">
	<meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<title>Quaked — corridor and ramp</title>
	<link rel="icon" type="image/svg+xml" href="icon.svg">
	<link rel="apple-touch-icon" href="icon.png">
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		html, body {
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #000;
		}
		canvas {
			display: block;
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			width: 100%;
			height: 100%;
		}
		#loading {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
			z-index: 100;
			background: #000;
		}
		#loading-bar {
			width: 200px;
			height: 2px;
			background: #333;
		}
		#loading-progress {
			width: 0%;
			height: 100%;
			background: #fff;
		}
	</style>
</head>
<body>
	<div id="loading">
		<div id="loading-bar"><div id="loading-progress"></div></div>
	</div>
	<script type="importmap">
	{
		"imports": {
			"three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js",
			"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/"
		}
	}
	</script>
	<section style="position:fixed;left:8px;top:8px;z-index:200;color:white;background:#111e;padding:10px;font:13px system-ui;max-width:650px">
<strong>Corridor flashlight / exit machine</strong>
<button id="easy">Easy corridor</button><button id="hard">Hard corridor</button><button id="normal">Normal corridor</button><button id="enter">Walk into corridor</button><button id="off">Flashlight off</button>
<button id="ramp">E1M1 ramp bottom</button><button id="top">Ramp top</button><button id="near">Approach machine</button>
<div id="status">Loading the real game…</div><details><summary>Diagnostics</summary><pre id="report" style="white-space:pre-wrap"></pre></details>
</section><script type="module" src="tests/welcome_ramp_trial.js"></script></body></html>
