<!doctype html>
<meta charset="utf-8">
<base href="../"> <!-- The production loader resolves loose assets from the game root. -->
<title>Wizard texture replacement verification</title>
<style>
body { background:#141719; color:#eef1ed; font:15px system-ui; margin:24px; }
h1 { font-size:26px; } #status { padding:14px; background:#253127; border-radius:8px; }
#tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:20px; margin-top:22px; }
article { background:#202529; padding:12px; border-radius:8px; } h2 { font-size:17px; margin:0 0 10px; }
.pictures { display:flex; gap:8px; } canvas { width:calc(50% - 4px); height:auto; } .repeat { width:100%; margin-top:8px; }
p { color:#b8c4c2; margin:8px 0; } #evidence { display:none; }
.pass { color:#a8e8b5; } .fail { color:#ffaaaa; }
</style>
<h1>Wizard texture replacement — actual loader and normal maps</h1>
<p>Left: replacement diffuse. Right: engine-generated normal map. Below: 2 × 2 diffuse repeat. These use the game loader, decoded WebP height files, and the engine's actual normal generator.</p>
<div id="status">Loading the twelve replacements…</div><div id="tiles"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js"}}</script>
<script type="module">
const status = document.querySelector('#status');
let checks = 0;
function check(ok, label) { if (!ok) throw new Error(label); checks++; }
function canvasFor(data, width, height) {
 const c = document.createElement('canvas'); c.width = width; c.height = height;
 c.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(data), width, height), 0, 0); return c;
}
try {
 await import('./src/engine/render/gl_rsurf.js'); // safe bootstrap of the existing module graph
 const THREE = await import('three');
 const {Cvar_RegisterVariable,Cvar_SetValue} = await import('./src/engine/common/cvar.js');
 const {r_hdr} = await import('./src/newer/render/gl_post.js');
 const {r_newer_textures,R_AnimSetNewer} = await import('./src/newer/render/r_anim.js');
 const {R_NewerTextureUpgrade} = await import('./src/newer/render/r_newertextures.js');
 const {R_NormalMapFor,R_NormalsFromCraftedHeight} = await import('./src/newer/render/gl_normals.js');
 Cvar_RegisterVariable(r_hdr); Cvar_RegisterVariable(r_newer_textures);
 Cvar_SetValue('r_hdr',1); Cvar_SetValue('r_newer_textures',1); R_AnimSetNewer(true);
 const recipe = await (await fetch('../tools/texture_sheets/sources/wizard-2026-10-01.json',{cache:'no-store'})).json();
 const index = await (await fetch('../newer/textures/index.json',{cache:'no-store'})).json();
 const results = [];
 for (const tile of recipe.textures) {
  const name = tile.name;
  const texture = new THREE.DataTexture(new Uint8Array(64*64*4).fill(100),64,64);
  texture.offset.set(0.125,0.25);
  const originalImage = texture.image;
  const oldNormal = R_NormalMapFor(texture);
  let disposed = false; oldNormal.addEventListener('dispose',()=>{disposed=true;});
  R_NewerTextureUpgrade(name,texture);
  const deadline = performance.now()+15000;
  while (!texture.userData.newerPicture && performance.now()<deadline) await new Promise(resolve=>setTimeout(resolve,20));
  check(texture.userData.newerPicture===true, name+': replacement loaded');
  check(texture.image.width===256 && texture.image.height===256, name+': diffuse dimensions');
  check(texture.userData.classicImage===originalImage, name+': classic pixels retained');
  check(disposed && texture._normalMap===undefined, name+': stale normal disposed');
  const height = texture.userData.newerHeight;
  check(height && height.file===index.normals[name].file, name+': matching crafted height loaded');
  check(height.width===256 && height.height===256 && height.data.length===65536, name+': aligned height dimensions');
  check(height.strength===index.normals[name].strength && height.cap===(index.normals[name].cap||1.1), name+': relief profile preserved');
  const normal = R_NormalMapFor(texture);
  check(normal!==oldNormal && normal.image.width===256 && normal.image.height===256, name+': new normal generated');
  check(normal.offset.x===texture.offset.x && normal.offset.y===texture.offset.y, name+': matching UV offset');
  check(normal.wrapS===THREE.RepeatWrapping && normal.wrapT===THREE.RepeatWrapping, name+': normals repeat');
  const expected = R_NormalsFromCraftedHeight(height.data,256,256,height.strength,height.cap), pixels = normal.image.data;
  let maxLengthError=0, minZ=1, alphaMatches=true;
  for(let i=0;i<65536;i++) {
   const x=pixels[i*4]/255*2-1,y=pixels[i*4+1]/255*2-1,z=pixels[i*4+2]/255*2-1;
   maxLengthError=Math.max(maxLengthError,Math.abs(Math.hypot(x,y,z)-1)); minZ=Math.min(minZ,z);
   if(pixels[i*4+3]!==expected[i*4+3]) alphaMatches=false;
  }
  check(maxLengthError<0.014 && minZ>0, name+': finite upward unit normals');
  check(alphaMatches, name+': parallax alpha matches the smoothed stored height');
  const article=document.createElement('article'),title=document.createElement('h2'); title.textContent=name; article.append(title);
  const pair=document.createElement('div'); pair.className='pictures';
  const diffuse=canvasFor(texture.image.data,256,256),normalCanvas=canvasFor(pixels,256,256); pair.append(diffuse,normalCanvas); article.append(pair);
  const repeat=document.createElement('canvas'); repeat.width=repeat.height=512; repeat.className='repeat';
  const ctx=repeat.getContext('2d'); for(const x of [0,256]) for(const y of [0,256]) ctx.drawImage(diffuse,x,y);
  article.append(repeat); const p=document.createElement('p'); p.className='pass'; p.textContent='PASS · 256×256 · UV and parallax aligned'; article.append(p); document.querySelector('#tiles').append(article);
  results.push({name,heightFile:height.file,maxLengthError,minZ});
  normal.dispose(); texture.dispose();
 }
 status.textContent=`PASS — ${recipe.textures.length}/12 textures loaded; ${checks} checks passed; manifest version ${index.version}.`;
 status.dataset.result='pass';
 const evidence=document.createElement('pre'); evidence.id='evidence'; evidence.textContent=JSON.stringify({version:index.version,checks,results},null,2); document.body.append(evidence);
} catch(error) {
 status.textContent='FAIL — '+error.message; status.className='fail'; status.dataset.result='fail'; console.error(error);
}
</script>
